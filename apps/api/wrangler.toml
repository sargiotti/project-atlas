name = "atlas"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true  # kept on purpose: the old host answers with a redirect to https://leyenda.ink (slice 24)

# Slice 24: custom domains (zone leyenda.ink must be Active before deploying). Canonical host is leyenda.ink; www redirects.
[[routes]]
pattern = "leyenda.ink"
custom_domain = true

[[routes]]
pattern = "www.leyenda.ink"
custom_domain = true

# One Worker serves the SPA (static assets) and the API.
# Slice 24: navigations must reach the Worker so non-canonical hosts (www, old workers.dev) can be redirected (the Worker
# falls through to ASSETS for everything that is not an API path, keeping `_headers`). Hashed and static files are excluded
# with negative patterns so they stay free and do not count towards the 100k/day request cap. When adding a new top-level
# static folder or root file under apps/web/public, add it here too. /e/*, /media/* and /api/* are matched by "/*".
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/*",
  "!/assets/*", "!/maps/*", "!/og/*", "!/tone-og/*",
  "!/favicon.ico", "!/favicon.svg", "!/favicon-32.png", "!/apple-touch-icon.png",
  "!/icon-192.png", "!/icon-512.png", "!/icon-maskable-512.png", "!/cover-badge.png",
  "!/google-g.svg", "!/beacon-loader.js", "!/manifest.webmanifest", "!/robots.txt",
]

# Single source of truth for the public origin. The Worker builds og:url / og:image from it, and the web
# build (vite.config.ts) reads this same line to bake the absolute Home og:image. Bare https origin,
# no trailing slash. Changing it later leaves already-shared links on the old address.
[vars]
PUBLIC_ORIGIN = "https://leyenda.ink"
# Slice 06: Google redirect URI, exact (only this one is registered on the OAuth client). Top-level only on purpose:
# previews and local dev do not set it, so sign-in there reports `not_configured` instead of sending a code to prod.
# Secrets (wrangler secret put, never in this file): GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ADMIN_EMAIL.
OAUTH_REDIRECT_URI = "https://leyenda.ink/api/v1/auth/google/callback"
# Slice 30: organizer request notification (Resend). From must be an exact @leyenda.ink address (strict DMARC, DKIM aligned).
# Secrets (wrangler secret put, never in this file): TURNSTILE_SECRET, RESEND_API_KEY. The public Turnstile site key is in
# packages/contract (TURNSTILE_SITE_KEY).
NOTIFY_FROM = "leyenda.ink <noreply@leyenda.ink>"
NOTIFY_TO = "contact@leyenda.ink"
NOTIFY_SUBJECT_PREFIX = ""

# Privacy (GDPR): invocation logs (automatic per-request logs that can include IP and request.cf geo)
# are OFF. Our own console.* logs still go to Workers Logs. Metrics stay on.
# https://developers.cloudflare.com/workers/observability/logs/workers-logs/
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

# Local dev uses miniflare (ignores database_id). database_id is the remote D1 created with
# `wrangler d1 create atlas --jurisdiction eu` (ADR 0007); it is an identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "atlas"
database_id = "89a8b90a-1b1f-427d-ac87-63a0fa6d6b2b"
migrations_dir = "migrations"

# Slice 08a: uploaded map images (ADR 0013). Private bucket, EU jurisdiction (user decision 2026-11-14): only this
# Worker reads and writes it, never r2.dev. Create with `wrangler r2 bucket create atlas-maps --jurisdiction eu`
# (and atlas-maps-preview). A jurisdiction bucket must be bound with the same jurisdiction. Local dev and tests use
# the miniflare R2 emulation, so the bucket does not need to exist to run locally.
[[r2_buckets]]
binding = "MAPS"
bucket_name = "atlas-maps"
jurisdiction = "eu"

# --- Rate limiting switch -------------------------------------------------------------
# Workers Rate Limiting binding for /api/*. The code skips limiting when the binding is
# absent, so to switch it OFF simply delete or comment out this block.
# Limits are approximate and per Cloudflare location (see docs). 60 requests / 60 s per IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60
  period = 60

# Stricter limiter for sign-in start/callback and invite inspect/create/revoke (slice 06): ~10 requests / 60 s per IP.
# Same approximate behavior and same fail-open switch as above (delete the block to turn it off).
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 10
  period = 60

# Slice 07: per-organizer write limit for panel event create/edit/delete, keyed on the organizer id (not the IP):
# ~20 requests / 60 s. Fails open and can be switched off by deleting the block, like the others.
[[ratelimits]]
name = "PANEL_WRITE_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 20
  period = 60

# Slice 08a: per-organizer map upload limit, keyed on the organizer id: ~5 uploads / 60 s. Fails open (the D1
# daily counter of 30 uploads per organizer is the real cap). Delete the block to switch it off.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 5
  period = 60

# Slice 08b: per-IP limit on /media/* map images, checked BEFORE the D1 read: ~300 requests / 60 s (a venue behind one NAT).
# Approximate and fail-open like the others; delete the block to switch it off.
[[ratelimits]]
name = "MEDIA_LIMITER"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 300
  period = 60

# Slice 08b: per-Admin-user limit on /api/v1/admin/events/*, keyed on the user id: ~60 requests / 60 s.
# /admin/invites* keeps the stricter per-IP AUTH_LIMITER. Fails open; delete the block to switch it off.
[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1006"
  [ratelimits.simple]
  limit = 60
  period = 60

# Slice 30: per-IP limit on the public organizer form (POST /api/v1/organizer-requests): ~3 requests / 60 s. Fails open
# (the D1 daily caps are the real bound). Delete the block to switch it off.
[[ratelimits]]
name = "FORM_LIMITER"
namespace_id = "1007"
  [ratelimits.simple]
  limit = 3
  period = 60

# Slice 08b: daily prune (moderation audit rows older than 365 days, old transition quota rows). 03:17 UTC.
# Cron triggers are free. Workers Previews have no cron support, so previews never run the prune.
[triggers]
crons = ["17 3 * * *"]

# --- Previews (Workers Builds, non-production branches) ---------------------------------
# Workers Builds runs `npx wrangler preview` for non-production branches. Preview deployments do NOT
# inherit bindings or vars from the top level, so everything the Worker needs is repeated here.
# The preview D1 (atlas-preview, EU) is separate from production so branch code and migrations never
# touch real data. database_id is an identifier, not a secret.
# [previews.vars] must stay AFTER the top-level PUBLIC_ORIGIN: apps/web/vite.config.ts takes the last match for previews.
[previews.vars]
PUBLIC_ORIGIN = "https://atlas.sargiotti67.workers.dev"
# Slice 30: previews do not inherit vars, so the notification vars are repeated. Preview mails are tagged.
NOTIFY_FROM = "leyenda.ink <noreply@leyenda.ink>"
NOTIFY_TO = "contact@leyenda.ink"
NOTIFY_SUBJECT_PREFIX = "[preview] "

[[previews.d1_databases]]
binding = "DB"
database_name = "atlas-preview"
database_id = "f755efdc-635c-4a62-9556-092b68d9cbbe"

[[previews.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"
  [previews.ratelimits.simple]
  limit = 60
  period = 60

[[previews.ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "2002"
  [previews.ratelimits.simple]
  limit = 10
  period = 60

[[previews.ratelimits]]
name = "PANEL_WRITE_LIMITER"
namespace_id = "2003"
  [previews.ratelimits.simple]
  limit = 20
  period = 60

[[previews.ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "2004"
  [previews.ratelimits.simple]
  limit = 5
  period = 60

[[previews.ratelimits]]
name = "MEDIA_LIMITER"
namespace_id = "2005"
  [previews.ratelimits.simple]
  limit = 300
  period = 60

[[previews.ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "2006"
  [previews.ratelimits.simple]
  limit = 60
  period = 60

[[previews.ratelimits]]
name = "FORM_LIMITER"
namespace_id = "2007"
  [previews.ratelimits.simple]
  limit = 3
  period = 60

[[previews.r2_buckets]]
binding = "MAPS"
bucket_name = "atlas-maps-preview"
jurisdiction = "eu"
