# Slice 38: uptime check. Every 30 minutes (best effort) it requests the key public URLs and fails the job
# (red run, GitHub emails the owner) if any does not answer exactly 200. No secrets, no third-party actions.
name: uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin to check. Only https://leyenda.ink or an Atlas preview (https://<name>-atlas.sargiotti67.workers.dev)."
        required: false
        default: "https://leyenda.ink"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public URLs
        env:
          BASE_URL_INPUT: ${{ inputs.base_url }}
        run: |
          base="${BASE_URL_INPUT:-https://leyenda.ink}"
          if ! printf '%s' "$base" | grep -Eq '^https://([a-z0-9-]+-atlas\.sargiotti67\.workers\.dev|leyenda\.ink)$'; then
            echo "base_url not allowed"
            exit 2
          fi
          fail=0
          for path in / /e/nightfall-meadows /organizadores /terms /api/v1/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -A 'atlas-uptime' "${base}${path}") || code="error"
            echo "${path} -> ${code}"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          exit "$fail"
